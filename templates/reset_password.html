<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password - ModernBlog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  
  <!-- Bootstrap Icons -->
  <link 
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
  />
  
  <style>
    /* ===================================================
       MODERN RESET PASSWORD - DESIGN SYSTEM
    =================================================== */
    
    :root {
      /* Color Palette */
      --primary-50: #f0f4ff;
      --primary-100: #e0e9ff;
      --primary-200: #c7d7fe;
      --primary-300: #a5bbfc;
      --primary-400: #8292f8;
      --primary-500: #6366f1;
      --primary-600: #4f46e5;
      --primary-700: #4338ca;
      --primary-800: #3730a3;
      --primary-900: #312e81;
      
      /* Secondary Colors */
      --secondary-50: #fdf4ff;
      --secondary-100: #fae8ff;
      --secondary-500: #d946ef;
      --secondary-600: #c026d3;
      
      /* Neutral Colors */
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      
      /* Status Colors */
      --success-50: #f0fdf4;
      --success-500: #10b981;
      --success-600: #059669;
      --error-50: #fef2f2;
      --error-500: #f43f5e;
      --error-600: #e11d48;
      --warning-500: #f59e0b;
      
      /* Surface Colors */
      --surface-primary: #ffffff;
      --surface-elevated: rgba(255, 255, 255, 0.95);
      --surface-glass: rgba(255, 255, 255, 0.25);
      
      /* Typography */
      --font-primary: 'Inter', 'Segoe UI', system-ui, sans-serif;
      
      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.2rem;
      --space-xl: 0.8rem;
      --space-2xl: 2rem;
      --space-3xl: 4rem;
      
      /* Border Radius */
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
      --radius-3xl: 2rem;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      
      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===================================================
       GLOBAL STYLES
    =================================================== */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-primary);
      font-size: 16px;
      line-height: 1.6;
      color: var(--gray-800);
      background: linear-gradient(
        135deg, 
        var(--primary-50) 0%, 
        var(--secondary-50) 50%, 
        var(--primary-100) 100%
      );
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===================================================
       LAYOUT COMPONENTS
    =================================================== */
    
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      position: relative;
    }

    .auth-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(217, 70, 239, 0.1) 0%, transparent 60%),
        radial-gradient(circle at 40% 70%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-card {
      background: var(--surface-elevated);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 520px;
      padding: var(--space-2xl);
      border-radius: var(--radius-3xl);
      box-shadow: var(--shadow-2xl);
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

   
    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(
        90deg, 
        var(--primary-500) 0%, 
        var(--secondary-500) 50%, 
        var(--primary-600) 100%
      );
    }

    /* ===================================================
       HEADER COMPONENTS
    =================================================== */
    
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-2xl);
      position: relative;
    }

    .auth-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, var(--primary-500), var(--secondary-500));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-lg);
      box-shadow: 
        0 8px 32px rgba(99, 102, 241, 0.3),
        0 0 0 10px rgba(99, 102, 241, 0.1);
      position: relative;
      animation: pulse 2s infinite;
    }

    .auth-icon::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(99, 102, 241, 0.2);
      border-radius: 50%;
      animation: rotate 10s linear infinite;
    }

    .auth-icon i {
      font-size: 2.5rem;
      color: white;
      z-index: 1;
    }

    .auth-title {
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--gray-800);
      margin-bottom: var(--space-md);
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, var(--gray-800), var(--gray-600));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-subtitle {
      color: var(--gray-600);
      font-size: 1.125rem;
      line-height: 1.5;
      font-weight: 300;
    }

    /* ===================================================
       FORM COMPONENTS
    =================================================== */
    
    .form-group {
      margin-bottom: var(--space-xl);
      position: relative;
      gap: 1.2rem
    }

    .form-label {
      display: block;
      margin-bottom: var(--space-sm);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--gray-700);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .form-control {
      width: 100%;
      padding: var(--space-lg) var(--space-md);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-xl);
      font-size: 1rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      background: rgba(255, 255, 255, 0.8);
      color: var(--gray-800);
      position: relative;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-500);
      box-shadow: 
        0 0 0 3px rgba(99, 102, 241, 0.1),
        var(--shadow-md);
      transform: translateY(-2px);
      background: var(--surface-primary);
    }

    .form-control::placeholder {
      color: var(--gray-400);
      font-weight: 400;
    }

    /* ===================================================
       PASSWORD STRENGTH INDICATORS
    =================================================== */
    
    .password-strength {
      margin-top: var(--space-sm);
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-lg);
      transition: all var(--transition-normal);
    }

    .strength-weak {
      color: var(--error-600);
      background: var(--error-50);
      border: 1px solid rgba(244, 63, 94, 0.2);
    }

    .strength-medium {
      color: var(--warning-500);
      background: #fffbeb;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .strength-strong {
      color: var(--success-600);
      background: var(--success-50);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    /* ===================================================
       BUTTON COMPONENTS
    =================================================== */
    
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: white;
      padding: var(--space-lg) var(--space-xl);
      font-size: 1.125rem;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-xl);
      cursor: pointer;
      transition: all var(--transition-normal);
      box-shadow: 
        0 4px 15px rgba(99, 102, 241, 0.4),
        0 0 0 0 rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: left 0.6s;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 8px 25px rgba(99, 102, 241, 0.5),
        0 0 0 3px rgba(99, 102, 241, 0.1);
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: var(--shadow-md);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--gray-600);
      text-decoration: none;
      font-weight: 500;
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-xl);
      transition: all var(--transition-fast);
      border: 2px solid var(--gray-200);
      background: var(--surface-primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      color: var(--primary-600);
      background: var(--primary-50);
      border-color: var(--primary-200);
      transform: translateY(-2px);
      text-decoration: none;
      box-shadow: var(--shadow-md);
    }

    /* ===================================================
       UTILITY COMPONENTS
    =================================================== */
    
    .back-button {
      position: absolute;
      top: var(--space-xl);
      left: var(--space-xl);
      z-index: 10;
    }

    .error-message {
      color: var(--error-600);
      background: var(--error-50);
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(244, 63, 94, 0.2);
      margin-bottom: var(--space-lg);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      box-shadow: var(--shadow-sm);
    }

    .success-message {
      color: var(--success-600);
      background: var(--success-50);
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(16, 185, 129, 0.2);
      margin-bottom: var(--space-lg);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      box-shadow: var(--shadow-sm);
    }

    .help-text {
      text-align: center;
      margin-top: var(--space-xl);
      color: var(--gray-500);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
    }

    /* ===================================================
       ANIMATIONS
    =================================================== */
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    /* ===================================================
       RESPONSIVE DESIGN
    =================================================== */
    
    @media (max-width: 768px) {
      .auth-container {
        padding: var(--space-lg);
      }
      
      .auth-card {
        padding: var(--space-lg);
        max-width: 100%;
      }
      
      .auth-title {
        font-size: 1.750rem;
      }
      
      .auth-subtitle {
        font-size: 1rem;
      }
      
      .back-button {
        top: var(--space-lg);
        left: var(--space-lg);
      }
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: var(--space-md);
      }
      
      .auth-card {
        padding: var(--space-lg);
        border-radius: var(--radius-2xl);
      }
      
      .auth-icon {
        width: 80px;
        height: 80px;
      }
      
      .auth-icon i {
        font-size: 2rem;
      }
      
      .auth-title {
        font-size: 1.75rem;
      }
      
      .back-button {
        top: var(--space-md);
        left: var(--space-md);
      }
    }
  </style>
</head>
<body>
  <!-- Back Button -->
  <a href="javascript:history.back()" class="btn-secondary back-button">
    <i class="bi bi-arrow-left"></i>
    <span>Back</span>
  </a>

  <div class="auth-container">
    <div class="auth-card">
      <!-- Enhanced Header -->
      <div class="auth-header">
        <div class="auth-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="auth-title">Reset Your Password</h1>
        <p class="auth-subtitle">
          Create a new secure password for your account and regain access to your dashboard.
        </p>
      </div>
      
      <!-- Message Container -->
      <div id="resetPasswordMessage"></div>
      
      <!-- reset Form -->
      <form id="resetPasswordForm">
        <!-- Hidden Token Field -->
        <input type="hidden" id="resetToken" name="token" />

        <!-- New Password Field -->
        <div class="form-group">
          <label for="newPassword" class="form-label">
            <i class="bi bi-key-fill"></i>
            New Password
          </label>
          <input 
            type="password" 
            id="newPassword" 
            class="form-control" 
            placeholder="Enter a strong new password" 
            autocomplete="new-password"
            required 
          />
          <div id="passwordStrength" class="password-strength"></div>
        </div>
        
        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">
            <i class="bi bi-check2-square-fill"></i>
            Confirm New Password
          </label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-control" 
            placeholder="Confirm your new password" 
            autocomplete="new-password"
            required 
          />
          <div id="passwordMatch" class="password-strength"></div>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" class="btn-primary" id="submitBtn">
          <i class="bi bi-shield-check-fill"></i>
          <span>Reset Password</span>
        </button>
      </form>
      
      <!-- Help Text -->
      <div class="help-text">
        <i class="bi bi-info-circle-fill"></i>
        <span>Password should be at least 6 characters long</span>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /**
     * Enhanced message display with animations
     */
    function showMessage(containerId, type, text) {
      const container = document.getElementById(containerId);
      if (!container) {
        console.warn("No container for", containerId);
        return;
      }
      
      const iconMap = {
        success: 'bi-check-circle-fill',
        error: 'bi-x-circle-fill'
      };
      
      container.innerHTML = `
        <div class="${type}-message">
          <i class="bi ${iconMap[type]}"></i>
          <span>${text}</span>
        </div>
      `;
      
      // Auto-dismiss with smooth animation
      setTimeout(() => {
        const message = container.querySelector(`.${type}-message`);
        if (message) {
          message.style.opacity = '0';
          message.style.transform = 'translateY(-10px)';
          message.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
          setTimeout(() => container.innerHTML = "", 300);
        }
      }, 5000);
    }

    /**
     * Enhanced password strength checker
     */
    function checkPasswordStrength(password) {
      const strengthIndicator = document.getElementById('passwordStrength');
      
      if (password.length === 0) {
        strengthIndicator.innerHTML = '';
        strengthIndicator.className = 'password-strength';
        return;
      }
      
      let strength = 0;
      let feedback = [];
      
      // Comprehensive strength checks
      if (password.length >= 6) strength++;
      else feedback.push('at least 6 characters');
      
      if (/[A-Z]/.test(password)) strength++;
      else feedback.push('uppercase letter');
      
      if (/[a-z]/.test(password)) strength++;
      else feedback.push('lowercase letter');
      
      if (/\d/.test(password)) strength++;
      else feedback.push('number');
      
      if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
      else feedback.push('special character');
      
      let strengthText = '';
      let strengthClass = '';
      let icon = '';
      
      if (strength <= 2) {
        strengthText = `Weak - Add: ${feedback.slice(0, 2).join(', ')}`;
        strengthClass = 'strength-weak';
        icon = 'bi-shield-x';
      } else if (strength <= 3) {
        strengthText = `Medium - Add: ${feedback[0] || 'more complexity'}`;
        strengthClass = 'strength-medium';
        icon = 'bi-shield-exclamation';
      } else {
        strengthText = 'Strong password ✓';
        strengthClass = 'strength-strong';
        icon = 'bi-shield-check';
      }
      
      strengthIndicator.innerHTML = `<i class="bi ${icon}"></i>${strengthText}`;
      strengthIndicator.className = `password-strength ${strengthClass}`;
    }

    /**
     * Enhanced password match checker
     */
    function checkPasswordMatch() {
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const matchIndicator = document.getElementById('passwordMatch');
      
      if (confirmPassword.length === 0) {
        matchIndicator.innerHTML = '';
        matchIndicator.className = 'password-strength';
        return;
      }
      
      if (password === confirmPassword) {
        matchIndicator.innerHTML = '<i class="bi bi-check-circle-fill"></i>Passwords match ✓';
        matchIndicator.className = 'password-strength strength-strong';
      } else {
        matchIndicator.innerHTML = '<i class="bi bi-x-circle-fill"></i>Passwords do not match';
        matchIndicator.className = 'password-strength strength-weak';
      }
    }

    // Event listeners for real-time validation
    document.getElementById('newPassword').addEventListener('input', function() {
      checkPasswordStrength(this.value);
      checkPasswordMatch();
    });

    document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

    // Extract and validate token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (token) {
      document.getElementById('resetToken').value = token;
    } else {
      showMessage("resetPasswordMessage", "error", "❌ No reset token provided in URL. Please request a new password reset.");
    }

    // Enhanced form submission handler
    document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const originalContent = submitBtn.innerHTML;

      // Show enhanced loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <i class="bi bi-arrow-clockwise spin"></i>
        <span>Resetting Password...</span>
      `;

      const token = document.getElementById("resetToken").value;
      const newPassword = document.getElementById("newPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      // Enhanced validation
      if (!token) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalContent;
        return showMessage(
          "resetPasswordMessage",
          "error",
          "❌ Invalid reset token. Please request a new password reset."
        );
      }

      if (newPassword !== confirmPassword) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalContent;
        return showMessage(
          "resetPasswordMessage",
          "error",
          "❌ Passwords do not match. Please check and try again."
        );
      }

      if (newPassword.length < 6) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalContent;
        return showMessage(
          "resetPasswordMessage",
          "error",
          "❌ Password must be at least 6 characters long for security."
        );
      }

      // Prepare form data
      const formData = new FormData();
      formData.append("token", token);
      formData.append("new_password", newPassword);

      try {
        const response = await fetch("/reset_password", {
          method: "PUT",
          credentials: "include",
          body: formData
        });
        
        const data = await response.json();
        console.log("Reset response:", response.status, data);
        
        if (!response.ok) {
          return showMessage(
            "resetPasswordMessage",
            "error",
            data.detail || "❌ Failed to reset password. Please try again."
          );
        }
        
        // Success handling
        showMessage(
          "resetPasswordMessage",
          "success",
          data.message || "✅ Password reset successfully! Redirecting to login..."
        );
        
        // Clear form fields
        document.getElementById("newPassword").value = "";
        document.getElementById("confirmPassword").value = "";
        document.getElementById("passwordStrength").innerHTML = "";
        document.getElementById("passwordMatch").innerHTML = "";
        
        // Enhanced success state
        submitBtn.innerHTML = `
          <i class="bi bi-check-circle-fill"></i>
          <span>Password Reset Complete!</span>
        `;
        
        // Redirect to login after success
        setTimeout(() => {
          window.location.href = "/";
        }, 3000);
        
      } catch (err) {
        console.error("Network error:", err);
        showMessage(
          "resetPasswordMessage",
          "error",
          "❌ Network error occurred. Please check your connection and try again."
        );
      } finally {
        // Reset button state only if not successful
        if (!submitBtn.innerHTML.includes('Complete')) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalContent;
        }
      }
    });

    // Add subtle entrance animations for form elements
    document.addEventListener('DOMContentLoaded', function() {
      const formGroups = document.querySelectorAll('.form-group');
      formGroups.forEach((group, index) => {
        group.style.opacity = '0';
        group.style.transform = 'translateY(20px)';
        
        setTimeout(() => {
          group.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
          group.style.opacity = '1';
          group.style.transform = 'translateY(0)';
        }, (index + 1) * 150);
      });
      
      // Animate submit button
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.style.opacity = '0';
      submitBtn.style.transform = 'translateY(20px)';
      
      setTimeout(() => {
        submitBtn.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        submitBtn.style.opacity = '1';
        submitBtn.style.transform = 'translateY(0)';
      }, (formGroups.length + 1) * 150);
    });

    // Enhanced keyboard navigation
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.target.type === 'password') {
        const form = document.getElementById('resetPasswordForm');
        if (form.checkValidity()) {
          form.dispatchEvent(new Event('submit'));
        }
      }
    });

    // Add focus management for better accessibility
    const passwordInputs = document.querySelectorAll('input[type="password"]');
    passwordInputs.forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
        this.parentElement.style.transition = 'transform 0.2s ease';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
