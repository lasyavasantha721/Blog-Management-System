
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password - ModernBlog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  
  <!-- Bootstrap Icons -->
  <link 
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
  />
  
  <style>
    :root {
      --primary-50: #f0f4ff;
      --primary-100: #e0e9ff;
      --primary-500: #6366f1;
      --primary-600: #4f46e5;
      --primary-700: #4338ca;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --surface-elevated: rgba(255, 255, 255, 0.9);
      --surface-glass: rgba(255, 255, 255, 0.25);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --font-primary: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-primary);
      font-size: 16px;
      line-height: 1.6;
      color: var(--gray-800);
      background: linear-gradient(135deg, 
        var(--primary-50) 0%, 
        #fdf4ff 50%, 
        var(--primary-100) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      position: relative;
    }

    .auth-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 70%),
                  radial-gradient(circle at 80% 80%, rgba(217, 70, 239, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-card {
      background: var(--surface-elevated);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 480px;
      padding: var(--space-xl);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-500), #d946ef);
      border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .auth-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-lg);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
    }

    .auth-icon i {
      font-size: 2rem;
      color: white;
    }

    .auth-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--gray-800);
      margin-bottom: var(--space-md);
    }

    .auth-subtitle {
      color: var(--gray-600);
      font-size: 1rem;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: var(--space-lg);
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--gray-700);
    }

    .form-control {
      width: 100%;
      padding: var(--space-md);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-xl);
      font-size: 1rem;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.8);
      color: var(--gray-800);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      transform: translateY(-1px);
      background: white;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: white;
      padding: var(--space-md) var(--space-lg);
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-xl);
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gray-600);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-xl);
      transition: all 0.2s ease;
      border: 1px solid var(--gray-200);
      background: white;
    }

    .btn-secondary:hover {
      color: var(--primary-600);
      background: var(--primary-50);
      border-color: var(--primary-200);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .back-button {
      position: absolute;
      top: var(--space-xl);
      left: var(--space-xl);
      z-index: 2;
    }

    .error-message {
      color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.1);
      padding: var(--space-md);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(244, 63, 94, 0.2);
      margin-bottom: var(--space-md);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .success-message {
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.1);
      padding: var(--space-md);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(16, 185, 129, 0.2);
      margin-bottom: var(--space-md);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .auth-container {
        padding: var(--space-md);
      }
      
      .auth-card {
        padding: var(--space-lg);
      }
      
      .back-button {
        top: var(--space-md);
        left: var(--space-md);
      }
    }
  </style>
</head>
<body>
  <!-- Back Button -->
  <a href="javascript:history.back()" class="btn-secondary back-button">
    <i class="bi bi-arrow-left"></i>
    <span>Back</span>
  </a>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="bi bi-key-fill"></i>
        </div>
        <h1 class="auth-title">Forgot Password?</h1>
        <p class="auth-subtitle">
          No worries! Enter your email address and we'll send you a secure reset link.
        </p>
      </div>
      
      <div id="forgotPasswordMessage"></div>
      
      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="resetEmail" class="form-label">
            <i class="bi bi-envelope me-1"></i>
            Email Address
          </label>
          <input 
            type="email" 
            name="email" 
            id="resetEmail" 
            class="form-control" 
            placeholder="Enter your registered email" 
            required 
          />
        </div>
        
        <button type="submit" class="btn-primary">
          <i class="bi bi-send"></i>
          <span>Send Reset Link</span>
        </button>
      </form>
      
      <div class="text-center mt-4">
        <small class="text-muted">
          <i class="bi bi-info-circle me-1"></i>
          Remember your password? 
          <a href="javascript:history.back()" class="text-primary fw-semibold">Sign in instead</a>
        </small>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /**
     * Enhanced message display
     */
    function showMessage(containerId, type, text) {
      const container = document.getElementById(containerId);
      if (!container) {
        console.warn("No container for", containerId);
        return;
      }
      
      const iconMap = {
        success: 'bi-check-circle-fill',
        error: 'bi-x-circle-fill'
      };
      
      container.innerHTML = `
        <div class="${type}-message">
          <i class="bi ${iconMap[type]}"></i>
          <span>${text}</span>
        </div>
      `;
      
      setTimeout(() => {
        const message = container.querySelector(`.${type}-message`);
        if (message) {
          message.style.opacity = '0';
          message.style.transform = 'translateY(-10px)';
          setTimeout(() => container.innerHTML = "", 300);
        }
      }, 5000);
    }

    document.getElementById("forgotPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalContent = submitBtn.innerHTML;
      
      // Show loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <i class="bi bi-arrow-clockwise" style="animation: spin 1s linear infinite;"></i>
        <span>Sending...</span>
      `;
      
      const email = document.getElementById("resetEmail").value.trim();

      const formData = new FormData();
      formData.append("email", email);
      formData.append("origin", window.location.origin);

      try {
        const response = await fetch("/request_password_reset", {
          method: "POST",
          credentials: "include",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          return showMessage(
            "forgotPasswordMessage",
            "error",
            data.detail || "❌ Error sending reset email"
          );
        }
        
        showMessage(
          "forgotPasswordMessage",
          "success",
          "✅ If an account exists with that email, a reset link has been sent!"
        );
        
        // Clear the form
        document.getElementById("resetEmail").value = "";
        
      } catch (err) {
        showMessage(
          "forgotPasswordMessage",
          "error",
          "❌ Network error. Please try again."
        );
      } finally {
        // Reset button state
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalContent;
      }
    });

    // Add CSS for spin animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
